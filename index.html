<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестовый проект для проверки</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Это итоговый проект <br>Курилко Иннокентия!</h1>
    <header class="navbar">
        <div class="logo">GAME<span>HUB</span></div>
        <nav>
            <a href="#">Главная</a>
            <a href="#">Магазин</a>
            <a href="#">Категории</a>
        </nav>
        <div class="search-box">
            <input type="text" placeholder="Поиск игр...">
        </div>
    </header>

    <main class="container">
        <aside class="sidebar">
            <h3>Жанры</h3>
            <ul>
                <li><a href="#" class="active">Все жанры</a></li>
                <li><a href="#">Экшен</a></li>
                <li><a href="#">RPG</a></li>
                <li><a href="#">Стратегии</a></li>
                <li><a href="#">Шутеры</a></li>
            </ul>
        </aside>

        <section class="game-grid">
    
            
            <div class="game-card">
                <div class="badge">ТОП</div>
                <img src="ведьмак.jpg" alt="ведьмак.jpg">
                <div class="info">
                    <h4>Ведьмак</h4>
                    <p class="price">1999 ₽</p>
                    <a href="ведьмак.jpg" target="_blank">
                        <button class="buy-btn">Подробнее</button>
                    </a>
                </div>
            </div>
        
            
            <div class="game-card">
                <div class="badge">ХИТ</div>
                <img src="Cyberpunk 2077.jpg" alt="Cyberpunk 2077">
                <div class="info">
                    <h4>Cyberpunk 2077</h4>
                    <p class="price">2499 ₽</p>
                    <a href="Cyberpunk 2077.jpg" target="_blank">
                        <button class="buy-btn">Подробнее</button>
                    </a>
                </div>
            </div>
        
           
            <div class="game-card">
                <div class="badge">NEW</div>
                <img src="ELDEN RING.jpg" alt="ELDEN RING">
                <div class="info">
                    <h4>ELDEN RING</h4>
                    <p class="price">3999 ₽</p>
                    <a href="ELDEN RING.jpg" target="_blank">
                        <button class="buy-btn">Подробнее</button>
                    </a>
                </div>
            </div>
        
        </section>
    </main>
</body>
</html>
</body>
</html>
